# TMedge on any Docker host.
#
#   cp .env.example .env          # fill in the secrets (see DOCKER.md)
#   docker compose up -d --build  # edge + web
#   docker compose --profile sim up -d      # ...plus the 9 simulated nodes
#   docker compose --profile tunnel up -d   # ...plus Cloudflare Tunnel (CLOUDFLARE_TUNNEL_TOKEN in .env)
#
# Security: Docker publishes ports around the host firewall (ufw/nftables
# INPUT rules do not apply to them). Set BIND_ADDR in .env to the one
# address the ports should listen on -- e.g. the host's LAN or Tailscale IP --
# rather than leaving them open on every interface. With the Cloudflare Tunnel
# profile, nothing needs to be published for public access at all.

x-tmedge: &tmedge
  build: .
  image: tmedge:1.0
  restart: unless-stopped
  env_file: .env
  volumes:
    # Your site layout (floors, tables, node positions). Remove to use the
    # example layout baked into the image.
    - ./config:/app/config:ro

services:
  edge:
    <<: *tmedge
    command: ["edge"]
    environment:
      WEB_PUSH_URLS: http://web:8080
      DATA_DIR: /data
      FIRMWARE_BUILD_WORKER_URL: http://firmware-worker:8123/build
      # Direct TMsense nodes (tmnode.v1, docs/DIRECT_NODE_PROTOCOL.md): off
      # unless NODE_PORT is set in .env. Inside the container it has to listen
      # beyond loopback for the tunnel container to reach it; the published
      # port below still binds to BIND_ADDR.
      NODE_HOST: 0.0.0.0
    volumes:
      - ./config:/app/config:ro
      - edge-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5200:5200/udp"   # TMnodes sending directly
      - "${BIND_ADDR:-127.0.0.1}:5210:5210"       # access gateways (TMWAccess), raw TCP or WebSocket
      - "${BIND_ADDR:-127.0.0.1}:8090:8090"       # debug console (admin)
      - "${BIND_ADDR:-127.0.0.1}:5211:5211"       # direct TMsense nodes (with NODE_PORT=5211)
    depends_on:
      firmware-worker:
        condition: service_healthy
    networks:
      - default
      - firmware-build
    # Nodes that talk to the edge directly (not through a gateway) are sent
    # commands at their source address; on Linux, uncomment host networking
    # so that address is the node's, not Docker's NAT. Gateways do not need it.
    # network_mode: host

  web:
    <<: *tmedge
    command: ["web"]
    environment:
      DATA_DIR: /data
      # Trust X-Forwarded-* from loopback and private addresses: the
      # cloudflared container (tunnel profile) reaches web over the Docker network.
      TRUST_PROXY: "loopback, uniquelocal"
    volumes:
      - web-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"       # student site

  firmware-worker:
    build:
      context: .
      dockerfile: Dockerfile.firmware-worker
    image: tmedge-platformio-worker:6.1.19
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: ${FIRMWARE_WORKER_PIDS:-128}
    cpus: ${FIRMWARE_WORKER_CPUS:-1.0}
    mem_limit: ${FIRMWARE_WORKER_MEMORY:-768m}
    memswap_limit: ${FIRMWARE_WORKER_MEMORY_SWAP:-1536m}
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=2g,mode=1777
      - /workspace:rw,nosuid,nodev,size=2g,mode=1777
    environment:
      PORT: 8123
      BUILD_TIMEOUT_SECONDS: ${FIRMWARE_WORKER_TIMEOUT_SECONDS:-1200}
    expose:
      - "8123"
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - firmware-build

  sim:
    <<: *tmedge
    profiles: ["sim"]
    command: ["sim", "--edge", "edge:5200", "--load", "0.55", "--walkers", "2"]
    depends_on: [edge]
    # The image's healthcheck probes web/console, which this role does not serve.
    healthcheck:
      disable: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web, edge]
    # In the Cloudflare dashboard, point the tunnel's public hostnames at the
    # service names: http://web:8080, http://edge:8090, http://edge:5210.

volumes:
  edge-data:
  web-data:

networks:
  firmware-build:
