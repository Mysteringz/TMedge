openapi: 3.0.3
info:
  title: TMedge student token authentication
  version: 1.0.0
  description: >-
    Student HTTP access tokens for controlled native and server-side clients.
    Existing browser cookies remain supported. Tokens are opaque signed TMedge
    credentials, not JWTs. Refresh tokens and third-party OAuth are not provided.
paths:
  /api/auth/token:
    post:
      summary: Authenticate a student and issue a fifteen-minute access token
      description: >-
        Uses the browser login credential rules, optional login Turnstile check,
        and shared IP rate limiter. Sets no cookie. Returns Cache-Control
        no-store and Pragma no-cache. Cross-origin browser requests are refused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Origin refused or required human verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body exceeds 8 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Unsupported body encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Shared login rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      summary: Revoke the presented student access token
      description: >-
        Requires bearer authentication without a tm_session cookie. Revokes only
        this token and leaves other tokens and browser sessions active.
      security:
        - studentBearer: []
      responses:
        '204':
          description: Token revoked; no body
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/occupancy:
    get:
      summary: Read current public campus locations and occupancy
      description: >-
        Requires a student browser session or student bearer token. Only the
        current winning public floor snapshots are returned. Each floor has
        the composite siteId/key identity. Unknown and stale availability stays
        null; private plans, draft data, sensor identity/pose, ownership, and
        model display names are never returned.
      security:
        - studentBearer: []
        - studentCookie: []
      responses:
        '200':
          description: Current public campus view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampusView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/search:
    get:
      summary: Search for adjacent free seats
      description: >-
        A legacy floor-only filter is accepted only when the floor ID is unique.
        `siteId` must be supplied together with `floor`; the pair selects exactly
        one composite campus location. Ambiguous floor-only filters return 409.
      security:
        - studentBearer: []
        - studentCookie: []
      parameters:
        - in: query
          name: seats
          required: true
          schema: { type: integer, minimum: 1, maximum: 30 }
        - in: query
          name: floor
          required: false
          schema: { type: string, maxLength: 100 }
        - in: query
          name: siteId
          required: false
          description: Required together with `floor`.
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Seat suggestions with composite location identity
          content:
            application/json:
              schema:
                type: object
                required: [seats, results]
                properties:
                  seats: { type: integer }
                  results:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/SeatSuggestion' }
        '400':
          description: Invalid seat count or siteId/floor pairing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The legacy floor-only identifier matches more than one site
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/activity:
    post:
      summary: Record a bounded student location interaction
      description: >-
        Requires student authentication, JSON, and `X-TM-Student-Activity: 1`.
        Browser writes must be same-origin. Location-specific events use the
        exact siteId/floorId pair; a legacy floor-only reference is accepted
        only when unique. Actor identity and live result counts are server-owned.
      security:
        - studentBearer: []
        - studentCookie: []
      parameters:
        - in: header
          name: X-TM-Student-Activity
          required: true
          schema: { type: string, enum: ['1'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentActivity' }
      responses:
        '202':
          description: Event accepted for best-effort activity logging
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Same-origin activity request is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '415':
          description: Activity body must use application/json
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Per-student activity rate limit exceeded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/models/{assetId}:
    get:
      summary: Read a currently referenced public uploaded GLB
      description: >-
        Requires a student session or bearer token. Bytes are served only when
        the asset is referenced by a current winning public floor descriptor;
        authorization is checked again after the file read. Private, console-only,
        losing, withdrawn, static legacy and unreferenced assets return 404.
      security:
        - studentBearer: []
        - studentCookie: []
      parameters:
        - in: path
          name: assetId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Immutable GLB bytes; private and not cacheable
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            ETag:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            model/gltf-binary:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invalid, private, missing or unreferenced asset
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    studentBearer:
      type: http
      scheme: bearer
      description: Short-lived signed TMedge student access token; not a JWT
    studentCookie:
      type: apiKey
      in: cookie
      name: tm_session
      description: Existing signed browser student session cookie
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Full student email or UID using configured university domains
        password:
          type: string
          maxLength: 1024
          writeOnly: true
        cf-turnstile-response:
          type: string
          description: Required when Turnstile is enabled; solved for the login action
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [900]
    CampusView:
      type: object
      required: [generatedAt, floors]
      properties:
        generatedAt: { type: integer, minimum: 0, description: Server view timestamp in milliseconds since epoch. }
        floors:
          type: array
          items: { $ref: '#/components/schemas/CampusFloor' }
    CampusFloor:
      type: object
      description: >-
        A closed public floor view. Campus metadata is listed with the floor
        fields so strict property validation accepts the composite view while
        rejecting private or unknown fields. The projection remains
        versionless and may carry validated v3 furniture defaults and table
        overrides as opaque asset references with render-only transforms.
      required: [id, building, name, width, height, outline, zones, tables, totals, siteId, key, edgeId, updatedAt, stale]
      not:
        required: [model, proceduralRoom]
      additionalProperties: false
      properties:
        id: { type: string, description: Floor ID, retained as the legacy bare identifier. }
        building: { type: string }
        name: { type: string }
        width: { type: number, exclusiveMinimum: 0, description: Floor width in centimeters. }
        height: { type: number, exclusiveMinimum: 0, description: Floor height in centimeters. }
        outline: { type: array, items: { $ref: '#/components/schemas/Point' } }
        zones:
          type: array
          items: { $ref: '#/components/schemas/ZoneState' }
        tables:
          type: array
          items: { $ref: '#/components/schemas/TableState' }
        totals: { $ref: '#/components/schemas/FloorTotals' }
        model:
          description: >-
            V2 uploaded descriptor object selects a GLB; null explicitly suppresses
            static-catalog fallback; absence retains the legacy static fallback
            unless proceduralRoom explicitly selects generated geometry. The
            model key cannot coexist with proceduralRoom.
          type: object
          nullable: true
          required: [assetId, transform]
          additionalProperties: false
          properties:
            assetId: { type: string, format: uuid }
            transform: { $ref: '#/components/schemas/ModelTransform' }
        proceduralRoom:
          type: string
          enum: [simple-rectangle-v1]
          description: >-
            V2 only. Selects the fixed 3 m rectangular room and 0.75 m table
            presentation generated from the validated floor/table/seat data.
            This field is mutually exclusive with model. V1 snapshots reject it.
        furnitureDefaults:
          $ref: '#/components/schemas/FurnitureSlots'
        siteId: { type: string }
        key: { type: string, description: 'Collision-safe JSON identity for [siteId, floorId].' }
        edgeId: { type: string }
        updatedAt: { type: integer, minimum: 0, description: Last accepted receipt time in milliseconds since epoch. }
        stale: { type: boolean }
    Point:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }
    ZoneState:
      type: object
      required: [id, name, polygon, people]
      properties:
        id: { type: string }
        name: { type: string }
        polygon: { type: array, items: { $ref: '#/components/schemas/Point' } }
        people: { type: integer, minimum: 0, nullable: true, description: null means zone count is unknown. }
    TableState:
      type: object
      required: [id, name, zoneId, rect, capacity, occupied, free, status, seats]
      additionalProperties: false
      properties:
        id: { type: string, description: Stable authored table ID. }
        name: { type: string }
        zoneId: { type: string }
        rect: { $ref: '#/components/schemas/Rectangle' }
        shape:
          description: Present for authored v2 geometry; omitted legacy tables retain rect geometry.
          oneOf:
            - $ref: '#/components/schemas/RectShape'
            - $ref: '#/components/schemas/CircleShape'
            - $ref: '#/components/schemas/PolygonShape'
        furnitureOverrides:
          $ref: '#/components/schemas/FurnitureSlots'
        capacity: { type: integer, minimum: 1 }
        occupied: { type: integer, minimum: 0, nullable: true }
        free: { type: integer, minimum: 0, nullable: true }
        status: { type: string, enum: [ok, fallback, unknown] }
        seats:
          type: array
          items: { $ref: '#/components/schemas/SeatState' }
    FurnitureSlots:
      type: object
      description: >-
        Optional v3 room defaults or whole-slot table overrides. Empty objects,
        null values, unknown keys, and partial assignments are invalid. No
        creator, library, digest, purpose, or storage metadata is public.
      minProperties: 1
      maxProperties: 2
      additionalProperties: false
      properties:
        table: { $ref: '#/components/schemas/FurnitureAssignment' }
        chair: { $ref: '#/components/schemas/FurnitureAssignment' }
    FurnitureAssignment:
      type: object
      required: [assetId, scale, yawDeg, elevationM]
      additionalProperties: false
      properties:
        assetId: { type: string, format: uuid }
        scale: { type: number, minimum: 0.01, maximum: 100 }
        yawDeg: { type: number, minimum: -360, maximum: 360 }
        elevationM: { type: number, minimum: 0, maximum: 10 }
    Rectangle:
      type: object
      required: [x, y, width, height]
      properties:
        x: { type: number }
        y: { type: number }
        width: { type: number, exclusiveMinimum: 0 }
        height: { type: number, exclusiveMinimum: 0 }
    RectShape:
      allOf:
        - $ref: '#/components/schemas/Rectangle'
        - type: object
          required: [type]
          properties: { type: { type: string, enum: [rect] } }
    CircleShape:
      type: object
      required: [type, cx, cy, radius]
      properties:
        type: { type: string, enum: [circle] }
        cx: { type: number }
        cy: { type: number }
        radius: { type: number, exclusiveMinimum: 0 }
    PolygonShape:
      type: object
      required: [type, points]
      properties:
        type: { type: string, enum: [polygon] }
        points: { type: array, minItems: 3, items: { $ref: '#/components/schemas/Point' } }
    SeatState:
      type: object
      required: [id, x, y, side, index, occupied, neighbors]
      properties:
        id: { type: string }
        x: { type: number, description: Plan coordinate in centimeters. }
        y: { type: number, description: Plan coordinate in centimeters. }
        side: { type: string, enum: [L, R, T, B] }
        index: { type: integer, minimum: 0 }
        occupied: { type: boolean, nullable: true }
        neighbors: { type: array, items: { type: string } }
    FloorTotals:
      type: object
      required: [seats, free, occupied, unknownSeats, tablesFullyFree]
      properties:
        seats: { type: integer, minimum: 0 }
        free: { type: integer, minimum: 0 }
        occupied: { type: integer, minimum: 0 }
        unknownSeats: { type: integer, minimum: 0 }
        tablesFullyFree: { type: integer, minimum: 0 }
    PublishedFloorModel:
      type: object
      required: [assetId, transform]
      additionalProperties: false
      properties:
        assetId: { type: string, format: uuid }
        transform: { $ref: '#/components/schemas/ModelTransform' }
    ModelTransform:
      type: object
      required: [scale, rotationDeg, positionM]
      properties:
        scale: { $ref: '#/components/schemas/Vector3' }
        rotationDeg: { $ref: '#/components/schemas/Vector3' }
        positionM: { $ref: '#/components/schemas/Vector3' }
    Vector3:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number }
        y: { type: number }
        z: { type: number }
    SeatSuggestion:
      type: object
      required: [siteId, key, floorId, floorName, building, tableIds, tableName, seatIds, freeAtTable, capacity, busyness]
      properties:
        siteId: { type: string }
        key: { type: string }
        floorId: { type: string }
        floorName: { type: string }
        building: { type: string }
        tableIds: { type: array, items: { type: string } }
        tableName: { type: string }
        seatIds: { type: array, items: { type: string } }
        freeAtTable: { type: integer, minimum: 0 }
        capacity: { type: integer, minimum: 1 }
        busyness: { type: number, minimum: 0, maximum: 1 }
    StudentActivity:
      oneOf:
        - type: object
          required: [action, seats]
          additionalProperties: false
          properties:
            action: { type: string, enum: [seat-search] }
            seats: { type: integer, minimum: 1, maximum: 30 }
            venueId: { type: string, maxLength: 100 }
            floorId: { type: string, maxLength: 100 }
            siteId: { type: string, maxLength: 100, description: Requires floorId. }
        - type: object
          required: [action, seats, floorId]
          additionalProperties: false
          properties:
            action: { type: string, enum: [space-view] }
            seats: { type: integer, minimum: 1, maximum: 30 }
            floorId: { type: string, maxLength: 100 }
            siteId: { type: string, maxLength: 100 }
        - type: object
          required: [action, seats, floorId, tableId]
          additionalProperties: false
          properties:
            action: { type: string, enum: [table-select] }
            seats: { type: integer, minimum: 1, maximum: 30 }
            floorId: { type: string, maxLength: 100 }
            siteId: { type: string, maxLength: 100 }
            tableId: { type: string, maxLength: 100 }
        - type: object
          required: [action, seats, floorId]
          additionalProperties: false
          properties:
            action: { type: string, enum: [directions-view] }
            seats: { type: integer, minimum: 1, maximum: 30 }
            floorId: { type: string, maxLength: 100 }
            siteId: { type: string, maxLength: 100 }
            tableId: { type: string, maxLength: 100 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    InvalidRequest:
      description: Malformed input, mixed credentials, or invalid Authorization syntax
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Invalid credentials or missing, expired, revoked, or wrong-purpose token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Student account storage unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected storage or server failure; no private details exposed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
