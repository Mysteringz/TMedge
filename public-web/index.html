<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HKUMySeat</title>
  <meta name="description" content="Live free seats in HKU study spaces">
  <link rel="icon" href="/favicon.svg?v={{v}}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <meta name="theme-color" content="#006F62">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="/ds-modernist.css?v={{v}}">
  <link rel="stylesheet" href="/styles.css?v={{v}}">
  <script type="module" src="/vendor/floor-viewer.js?v={{v}}"></script>
  <script type="module" src="/js/dashboard-client/app.js?v={{v}}"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="left">
        <div class="mark" aria-hidden="true"></div>
        <div class="name">HKUMySeat</div>
        <div class="bar" aria-hidden="true"></div>
        <div class="crumb text-muted" id="crumb">Search</div>
      </div>
      <div class="right">
        <div class="livetag" id="live" data-state="connecting" role="status" aria-live="polite">
          <span class="pulse" aria-hidden="true"></span><span id="live-text">Connecting…</span>
        </div>
        <span class="who text-muted" id="user-name"></span>
        <form method="post" action="/logout"><button class="btn btn-secondary" type="submit">Sign out</button></form>
      </div>
    </header>
    <main id="screen"></main>
  </div>
</body>
</html>
