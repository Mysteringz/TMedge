# Every PR and every push to main runs the checks that "before calling work
# done" asks for, on a clean Linux machine: the same OS family and Node major
# as the EC2 box, so "passes on the dev Mac" stops being the only evidence.
# Branch protection on main should require the "check" job (see
# deploy/pipeline.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand to test this repo against a TMsense branch before that
  # branch is merged (the wire format has to agree in both).
  workflow_dispatch:
    inputs:
      tmsense_ref:
        description: TMsense branch, tag or commit to crosscheck against
        default: ""

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tmedge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tmedge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: tmedge_test
      PG_MIGRATION_USER: tmedge_migrator
      PG_MIGRATION_PASSWORD: ci-migration-test-only
      PG_RUNTIME_USER: tmedge_runtime
      PG_RUNTIME_PASSWORD: ci-runtime-test-only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: TMedge
          persist-credentials: false

      - name: Resolve pinned firmware
        id: firmware
        env:
          REQUESTED_REF: ${{ inputs.tmsense_ref }}
        run: |
          ref="${REQUESTED_REF:-$(cat TMedge/ci/tmsense.ref)}"
          [[ "$ref" =~ ^[a-zA-Z0-9_./-]+$ ]] || exit 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The wire format lives in two repos, so the crosscheck needs the
      # firmware's sources next to this one (it looks in ../TMsense). TMsense
      # is public, so no token is needed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Mysteringz/TMsense
          ref: ${{ steps.firmware.outputs.ref }}
          path: TMsense
          persist-credentials: false

      - name: Resolve pinned gateway
        id: gateway
        run: echo "ref=$(cat TMedge/ci/tmwaccess.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Mysteringz/TMWAccess
          ref: ${{ steps.gateway.outputs.ref }}
          path: TMWAccess
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            TMedge/package-lock.json
            TMedge/web-app/package-lock.json
            TMedge/algo-app/package-lock.json
            TMWAccess/package-lock.json

      - name: Install
        working-directory: TMedge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 strips capabilities from unconfined user namespaces.
          # Permit them on this disposable CI runner so the mandatory bwrap
          # filesystem/network isolation regression can actually execute.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 -m venv /tmp/tmedge-ci-python
          /tmp/tmedge-ci-python/bin/pip install numpy==2.2.6 opencv-python-headless==5.0.0.93
          echo /tmp/tmedge-ci-python/bin >> "$GITHUB_PATH"
          npm ci --no-audit --no-fund
          npm --prefix web-app ci --no-audit --no-fund
          npm --prefix algo-app ci --no-audit --no-fund
          npm --prefix ../TMWAccess ci --no-audit --no-fund

      - name: Configure isolated PostgreSQL test roles
        env:
          PGPASSWORD: ci-admin-test-only
        run: |
          psql --host 127.0.0.1 --username postgres --dbname tmedge_test \
            --set ON_ERROR_STOP=1 --file TMedge/docker/postgres-test/init/001-roles.sql

      - name: Typecheck
        working-directory: TMedge
        run: npm run typecheck

      - name: Test
        working-directory: TMedge
        env:
          PG_INTEGRATION_TEST: '1'
        run: npm test

      # Compiles the firmware's own packet code (g++ + OpenSSL, both on the
      # runner image) and parses its bytes with the edge's parser.
      - name: Crosscheck against TMsense
        working-directory: TMedge
        run: npm run crosscheck

      - name: Crosscheck gateway against the real edge
        working-directory: TMWAccess
        run: npm run crosscheck

      - name: Release archive security tests
        working-directory: TMedge
        run: |
          python3 deploy/test-release.py
          python3 deploy/test-receiver.py
          python3 deploy/training/test-offline.py

      - name: Real PostgreSQL schema migration and ingest regressions
        working-directory: TMedge
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-admin-test-only@127.0.0.1:5432/tmedge_test
        run: |
          python3 -m venv /tmp/training-test-env
          /tmp/training-test-env/bin/pip install 'psycopg[binary]==3.3.6'
          /tmp/training-test-env/bin/python deploy/training/test-postgres.py

      # Proves the site (server, console and the Vite app) actually builds.
      - name: Build
        working-directory: TMedge
        run: npm run build

      # The deploy script is what touches production, so it is tested like
      # code: migrate, deploy, automatic rollback of a broken release, manual
      # rollback, pruning and the lock, against a scratch /opt on the runner.
      # It never contacts a server.
      - name: Deploy pipeline (local rehearsal)
        working-directory: TMedge
        run: deploy/test-deploy.sh

      - name: Package the tested runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: TMedge
        run: python3 deploy/release.py package . ../release/tmedge.tar.gz

      - name: Store release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify documented Docker build
        run: docker build --tag tmedge:ci .
