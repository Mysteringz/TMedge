# Runtime changes are checked on the production OS/Node family. Keep the
# required checks present for README-only PRs: workflow-level path filters
# leave required checks pending forever.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by hand to test this repo against a TMsense branch before that
  # branch is merged (the wire format has to agree in both).
  workflow_dispatch:
    inputs:
      tmsense_ref:
        description: TMsense branch, tag or commit to crosscheck against
        default: ""
      readme_only:
        description: Check a bot README branch without runtime jobs (the diff is verified)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify README automation and classify the complete diff
        id: scope
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          bash -n ci/update_readme.sh
          python3 ci/change_scope.py

  build-test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tmedge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tmedge_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: tmedge_test
      PG_MIGRATION_USER: tmedge_migrator
      PG_MIGRATION_PASSWORD: ci-migration-test-only
      PG_RUNTIME_USER: tmedge_runtime
      PG_RUNTIME_PASSWORD: ci-runtime-test-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: TMedge
          persist-credentials: false

      - name: Resolve pinned firmware
        id: firmware
        env:
          REQUESTED_REF: ${{ inputs.tmsense_ref }}
        run: |
          ref="${REQUESTED_REF:-$(cat TMedge/ci/tmsense.ref)}"
          [[ "$ref" =~ ^[a-zA-Z0-9_./-]+$ ]] || exit 1
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The wire format lives in two repos, so the crosscheck needs the
      # firmware's sources next to this one (it looks in ../TMsense). TMsense
      # is public, so no token is needed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mysteringz/TMsense
          ref: ${{ steps.firmware.outputs.ref }}
          path: TMsense
          persist-credentials: false

      - name: Resolve pinned gateway
        id: gateway
        run: echo "ref=$(cat TMedge/ci/tmwaccess.ref)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Mysteringz/TMWAccess
          ref: ${{ steps.gateway.outputs.ref }}
          path: TMWAccess
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            TMedge/package-lock.json
            TMedge/web-app/package-lock.json
            TMedge/algo-app/package-lock.json
            TMWAccess/package-lock.json

      - name: Install
        working-directory: TMedge
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 strips capabilities from unconfined user namespaces.
          # Permit them on this disposable CI runner so the mandatory bwrap
          # filesystem/network isolation regression can actually execute.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          python3 -m venv /tmp/tmedge-ci-python
          /tmp/tmedge-ci-python/bin/pip install numpy==2.2.6 opencv-python-headless==5.0.0.93
          echo /tmp/tmedge-ci-python/bin >> "$GITHUB_PATH"
          npm ci --no-audit --no-fund
          npm --prefix web-app ci --no-audit --no-fund
          npm --prefix algo-app ci --no-audit --no-fund
          npm --prefix ../TMWAccess ci --no-audit --no-fund

      - name: Configure isolated PostgreSQL test roles
        env:
          PGPASSWORD: ci-admin-test-only
        run: |
          psql --host 127.0.0.1 --username postgres --dbname tmedge_test \
            --set ON_ERROR_STOP=1 --file TMedge/docker/postgres-test/init/001-roles.sql
          psql --host 127.0.0.1 --username postgres --dbname tmedge_test --set ON_ERROR_STOP=1 \
            --command "CREATE DATABASE crowdaware_training"

      - name: Typecheck
        working-directory: TMedge
        run: npm run typecheck

      - name: Start disposable isolated firmware worker
        working-directory: TMedge
        run: |
          docker build --file Dockerfile.firmware-worker --tag tmedge-ci-worker .
          docker run --detach --name tmedge-ci-worker --read-only \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges:true \
            --pids-limit 128 --cpus 1 --memory 768m --memory-swap 1536m \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g,mode=1777 \
            --tmpfs /workspace:rw,nosuid,nodev,size=2g,mode=1777 \
            --publish 127.0.0.1:8123:8123 tmedge-ci-worker
          for attempt in $(seq 30); do
            curl --fail --silent http://127.0.0.1:8123/healthz && exit 0
            sleep 1
          done
          docker logs tmedge-ci-worker
          exit 1

      - name: Test
        working-directory: TMedge
        env:
          PG_INTEGRATION_TEST: '1'
          PG_TEST_CONTAINER_ID: ${{ job.services.postgres.id }}
          TMEDGE_TEST_WORKER_URL: http://127.0.0.1:8123/build
          ML_DATA_TEST_ADMIN_URL: postgresql://postgres:ci-admin-test-only@127.0.0.1:5432/crowdaware_training
          ML_DATA_TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: npm test

      # Compiles the firmware's own packet code (g++ + OpenSSL, both on the
      # runner image) and parses its bytes with the edge's parser.
      - name: Crosscheck against TMsense
        working-directory: TMedge
        run: npm run crosscheck

      - name: Crosscheck gateway against the real edge
        working-directory: TMWAccess
        run: npm run crosscheck

      - name: Release archive security tests
        working-directory: TMedge
        run: |
          python3 deploy/test-release.py
          python3 deploy/test-adoption-storage.py
          python3 deploy/test-receiver.py
          python3 deploy/training/test-offline.py
          python3 deploy/training/test-schemaspy.py
          python3 deploy/training/test-remote-exports.py

      - name: Thermal ML data tools
        working-directory: TMedge
        run: python3 -m unittest discover -s tools/thermalml -t . -p 'test_*.py'

      - name: Real PostgreSQL schema migration and ingest regressions
        working-directory: TMedge
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-admin-test-only@127.0.0.1:5432/tmedge_test
        run: |
          python3 -m venv /tmp/training-test-env
          /tmp/training-test-env/bin/pip install 'psycopg[binary]==3.3.6'
          /tmp/training-test-env/bin/python deploy/training/test-postgres.py

      # Proves the site (server, console and the Vite app) actually builds.
      - name: Build
        working-directory: TMedge
        run: npm run build

      - name: Algorithm console mobile browser regressions
        working-directory: TMedge
        run: |
          npx playwright install --with-deps chromium webkit
          npm run test:algo-mobile

      # The deploy script is what touches production, so it is tested like
      # code: migrate, deploy, automatic rollback of a broken release, manual
      # rollback, pruning and the lock, against a scratch /opt on the runner.
      # It never contacts a server.
      - name: Deploy pipeline (local rehearsal)
        working-directory: TMedge
        run: deploy/test-deploy.sh

      - name: Package the tested runtime
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: TMedge
        run: python3 deploy/release.py package . ../release/tmedge.tar.gz

      - name: Store release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  container:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify documented Docker build
        run: docker build --tag tmedge:ci .

  check:
    # A classifier failure must fail a required check, not merely skip both
    # required jobs and accidentally allow an unverified PR to merge.
    if: always()
    needs: [changes, build-test, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require successful classification and the appropriate checks
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RUNTIME: ${{ needs.changes.outputs.runtime }}
          BUILD_RESULT: ${{ needs.build-test.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          set -euo pipefail
          [[ "$SCOPE_RESULT" == success ]] || exit 1
          if [[ "$RUNTIME" == false ]]; then
            [[ "$BUILD_RESULT" == skipped && "$CONTAINER_RESULT" == skipped ]] || exit 1
            echo "README-only change: no runtime build, tests, containers or release artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$RUNTIME" == true && "$BUILD_RESULT" == success && "$CONTAINER_RESULT" == success ]] || exit 1
          fi
