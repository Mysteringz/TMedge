name: Deploy production
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful CI push run on current main (see Actions)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      sha: ${{ steps.release.outputs.sha }}
      deployable: ${{ steps.release.outputs.deployable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate source run and caller
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REF" == refs/heads/main && "$RUN_ID" =~ ^[0-9]+$ ]]
          if [[ "$EVENT" == workflow_dispatch ]]; then
            permission=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
            [[ "$permission" == admin ]]
          fi
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$REPOSITORY" '.conclusion == "success" and .event == "push" and .head_branch == "main" and .path == ".github/workflows/ci.yml" and .head_repository.full_name == $repo' run.json
          sha=$(jq -r .head_sha run.json)
          # README-only CI is successful for branch protection, but it did
          # not build a runtime artifact and must not request production approval.
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100" > jobs.json
          if jq -e '
            ([.jobs[] | select(.name == "changes" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "check" and .conclusion == "success")] | length) == 1 and
            ([.jobs[] | select(.name == "build-test" and .conclusion == "skipped")] | length) == 1 and
            ([.jobs[] | select(.name == "container" and .conclusion == "skipped")] | length) == 1
          ' jobs.json; then
            [[ "$EVENT" != workflow_dispatch ]] || { echo "README-only CI has no deployable artifact" >&2; exit 1; }
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "README-only change: no production deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 ci/runtime_identity.py "$sha" "$REPOSITORY"
          echo "deployable=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $sha; CI run: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: validate
    if: needs.validate.outputs.deployable == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://hkumyseat.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ needs.validate.outputs.sha }}
          path: release
          run-id: ${{ needs.validate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Check release identity and configure pinned SSH host
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST_KEYS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A newer runtime may have landed while approval was pending. A
          # README refresh must neither invalidate a checked release nor allow
          # any source/configuration change to bypass a fresh artifact.
          python3 ci/runtime_identity.py "$EXPECTED_SHA" "$REPOSITORY"
          (cd release && sha256sum --check tmedge.tar.gz.sha256)
          python3 deploy/release.py extract release/tmedge.tar.gz "$RUNNER_TEMP/validated"
          [[ "$EXPECTED_SHA" == "$(jq -r .commit "$RUNNER_TEMP/validated/RELEASE.json")" ]]
          test -n "$DEPLOY_KEY" && test -n "$HOST_KEYS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tmedge_ci
          chmod 600 ~/.ssh/tmedge_ci
          printf '%s\n' "$HOST_KEYS" > ~/.ssh/known_hosts
      # The receiver and remote.sh on the box are installed by hand and a
      # release cannot replace them. If they differ from this commit's
      # deploy/, the release would be health-checked by rules it was never
      # tested against, so stop here, before anything is uploaded.
      - name: Check the server's deploy tools match this release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/tmedge_ci
          DEPLOY_RESTRICTED_KEY: 1
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          deploy/deploy.sh receiver-check
      - name: Deploy the tested artifact
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: /home/runner/.ssh/tmedge_ci
          DEPLOY_RESTRICTED_KEY: 1
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          deploy/deploy.sh artifact release/tmedge.tar.gz
      - name: Verify public login page
        run: curl --fail --silent --show-error --retry 3 --max-time 15 https://hkumyseat.com/login/ -o /dev/null
      - name: Release summary
        if: always()
        env:
          RELEASE_SHA: ${{ needs.validate.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          echo "Production deployment: $RESULT; commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/tmedge_ci
